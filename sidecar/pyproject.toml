[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pry-sidecar"
version = "0.3.7"
description = "Python sidecar for Pry — local-first interpretability app"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Loose on purpose: the runtime constraints files
    # (src-tauri/resources/constraints-runtime-*.txt, passed as `-c` to every
    # pip step) are authoritative and pin the exact tagged torch build. A tight
    # pin here made step 5 re-resolve torch from PyPI (T3a replay).
    "torch>=2.5,<3",
    "transformer-lens>=2.11,<3",
    "sae-lens>=5.0,<6",
    "starlette>=0.40,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "safetensors>=0.4,<1",
    "huggingface_hub>=0.26,<1",
    "hf_transfer>=0.1,<1",
    "numpy>=1.26,<3",
    "requests>=2.32,<3",
    # pyarrow 26 needs NumPy 2 at import, but TL/sae-lens keep NumPy 1.x.
    # 23.0.1 + NumPy 1.26 is verified working (shipped 0.1.1 runtime). The
    # runtime constraints files pin the exact version; this guards dev installs.
    "pyarrow<24",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "httpx",
    "ipykernel",
    "jupyter",
]

[tool.hatch.build.targets.wheel]
packages = ["pry_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
markers = [
    "inference: loads real model weights from the local HF cache and runs on CPU (slow)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
