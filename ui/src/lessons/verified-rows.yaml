# Verified rows (plan T6a). Rows 1-39 are concept map section 7.4; rows 40+
# cover every outline item the scanner (`npm run lessons:rows`) finds outside
# them. Every number a lesson relies on is recorded through Pry's own sidecar
# by `pytest sidecar/tests/test_lessons.py --record` and pinned under
# `__generated__/responses/<request key>.json`.
#
# Fields per row:
#   id        row number (1-39 = map 7.4; 40+ = new)
#   label     the outline's own label for the row, when it proposed one
#   outline   scanner items the row covers: `<file>:<line>` (every item on that
#             line) or `<file>:<line>.<n>` (the n-th item on that line)
#   lessons   lessons citing the row
#   requests  what is sent, built by `npm run lessons:compile -- --rows` through
#             the T4-ts body builders (ui/src/lib/sidecar.ts). Actions:
#             run (Run button), compare (one Compare prompt), writeIt (Watch it
#             write; maxNewTokens defaults to the app's 20), logitLens, dla,
#             patch, ablateHeads (`heads` = one knockout of those heads together;
#             `singles` = one request per listed head; `heads: all-single` =
#             one request per head of the model's 12 x 12),
#             ablateFeatures, steer (always with the MF-4 control), circuit
#             (Key parts), headScores, embedding.
#             repeat: n = n separate sidecar calls (<key>.r<n>.json);
#             network: Neuronpedia labels and snippets fetched at record time;
#             offline: the call runs with every non-loopback connection blocked.
#   record    the fields recorded
#   claim     what the lessons say, which the record checks
#   status    verified | narrowed | failed | needs-brad | closed-by-task (see t6a-rows.md)
#   note      fallback applied (narrowed), or the contradiction (needs-brad)
#   constants the row constants lessons cite as `$row.<id>.<field>` and
#             `{row: <id>.<field>}` (plan:297, :299). Each is derived from this
#             row's recorded `values` in rows.json (or its own request
#             arguments) by exactly one of: path, token_prob (+ token),
#             last_position, request, parse_head (+ take), first_mlp_layer,
#             argmax (+ by, take, exclude_layer), count, list, points
#             (percentage points -> probability), token_position (a token's
#             position in the row's recorded response), literal (authored,
#             needs `source`; `kind: literature` when not measured), alias (row
#             n's constant of the same name); `round: d`; `negate: true` flips the
#             sign; `from_row: n` reads row n's recorded values instead (a row
#             that recorded the same run or preset, said in `note`); and a unit
#             (layer, head, position, probability, logit, count, number,
#             string, list (+ of), record). `npm run lessons:compile -- --rows`
#             derives them into rows.json `rows[].constants`; run it again after
#             every `--record`. A field with nothing recorded to derive from is
#             left out (see evidence row-constants.md "Cannot derive").
#
# Positions count the start-of-text marker as 0, as Pry's token strip does.
# Layers use Pry's labels L0-L11. Outline files are never edited (plan C3-10).

model: gpt2-small
rows:
