<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect width="720" height="460" fill="#ffffff"/>
<path d="M480,80 Q567.5,105.0 600,190" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M600,270 Q567.5,355.0 480,380" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M240,380 Q152.5,355.0 120,270" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M120,190 Q152.5,105.0 240,80" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="245.0" y="35.0" width="230" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="360" y="64" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">1. Guess</text><text x="360" y="86" text-anchor="middle" font-size="12.5" fill="#6b7280">the next token of real text</text>
<rect x="485.0" y="195.0" width="230" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="600" y="224" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">2. Compare</text><text x="600" y="246" text-anchor="middle" font-size="12.5" fill="#6b7280">with what really came next</text>
<rect x="245.0" y="355.0" width="230" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="360" y="384" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">3. Nudge</text><text x="360" y="406" text-anchor="middle" font-size="12.5" fill="#6b7280">every weight a little</text>
<rect x="5.0" y="195.0" width="230" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="120" y="224" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">4. Repeat</text><text x="120" y="246" text-anchor="middle" font-size="12.5" fill="#6b7280">billions of times</text>
<text x="360" y="222" text-anchor="middle" font-size="14" fill="#1f2937">Training happened once, before</text>
<text x="360" y="242" text-anchor="middle" font-size="14" fill="#1f2937">you ever ran it. Using the model</text>
<text x="360" y="262" text-anchor="middle" font-size="14" fill="#1f2937">never runs this loop.</text>
</svg>
