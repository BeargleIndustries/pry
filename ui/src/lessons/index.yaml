# Pry's bundled lessons, in path order, with their stages (plan T6, plan:511-534).
# The loader orders bundled lessons by this list; the copy lint reads it as the
# path (a term must be introduced earlier on it). Stage 0 is the quick tour,
# which sits outside the stages.
#
# All 20 ids are listed. While the T6 lanes run apart, a listed id may have no
# folder yet in a lane's worktree: the loader skips it, and
# lessons-content.test.ts allows a missing folder only for the ids other lanes
# write (it fails on any other gap, and on a folder this file doesn't list).
lessons:
  - { id: pry.quick-tour, stage: 0 }
  - { id: pry.p1-1, stage: 1 }
  - { id: pry.p1-2, stage: 1 }
  - { id: pry.p1-3, stage: 1 }
