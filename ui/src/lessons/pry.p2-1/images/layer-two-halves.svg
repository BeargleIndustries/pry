<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>One layer, two halves</title>
  <rect width="640" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6fb6"/>
    </marker>
  </defs>
  <!-- tokens -->
  <g text-anchor="middle" fill="#222">
    <rect x="70" y="300" width="100" height="34" rx="6" fill="#f2f2f2" stroke="#999"/>
    <text x="120" y="322">earlier</text>
    <rect x="270" y="300" width="100" height="34" rx="6" fill="#f2f2f2" stroke="#999"/>
    <text x="320" y="322">earlier</text>
    <rect x="470" y="300" width="100" height="34" rx="6" fill="#f2f2f2" stroke="#999"/>
    <text x="520" y="322">this token</text>
  </g>
  <!-- attention half -->
  <rect x="30" y="170" width="580" height="100" rx="10" fill="#eaf1fb" stroke="#3b6fb6"/>
  <text x="44" y="192" fill="#1f3f6e" font-weight="600">Attention half: mixes in from this token and earlier ones</text>
  <path d="M120,262 C200,215 420,215 510,248" fill="none" stroke="#3b6fb6" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M320,262 C380,232 460,232 512,252" fill="none" stroke="#3b6fb6" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M540,262 C570,236 560,222 528,246" fill="none" stroke="#3b6fb6" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="44" y="258" fill="#555" font-size="12">Arrows only come from the token itself or from before it. Nothing comes from later.</text>
  <!-- other half -->
  <rect x="30" y="30" width="580" height="110" rx="10" fill="#f6f1e7" stroke="#a07a2c"/>
  <text x="44" y="52" fill="#6b4f16" font-weight="600">Other half: works on each token on its own (named in P2.4)</text>
  <g fill="#fffaf0" stroke="#a07a2c">
    <rect x="80" y="70" width="80" height="50" rx="6"/>
    <rect x="280" y="70" width="80" height="50" rx="6"/>
    <rect x="480" y="70" width="80" height="50" rx="6"/>
  </g>
  <text x="320" y="160" text-anchor="middle" fill="#555" font-size="12">No arrows between tokens in this half</text>
</svg>
