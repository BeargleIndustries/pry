name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'release/**']

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # --- Sidecar (Python) -------------------------------------------------
      # Installed with pip, the same tool the runtime bootstrapper uses.
      # Inference tests need cached model weights and are skipped here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/pyproject.toml

      - name: Install sidecar (CPU torch)
        shell: pwsh
        run: |
          python -m venv sidecar/.venv
          sidecar/.venv/Scripts/python -m pip install --upgrade pip
          $constraints = "src-tauri/resources/constraints-runtime-cpu.txt"
          $extra = @()
          if (Test-Path $constraints) { $extra = @("-c", $constraints) }
          sidecar/.venv/Scripts/python -m pip install -e "sidecar[dev]" @extra --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Sidecar tests (no inference)
        working-directory: sidecar
        run: .venv/Scripts/python -m pytest -m "not inference" -q

      # --- Rust shell --------------------------------------------------------
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! needs the frontend dist dir to exist.
      - name: Placeholder frontend build dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force ui/build | Out-Null

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # --- UI ------------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI install, type-check, tests
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm test

      # The outsider-gate example lessons stay clean (plan T8 step 1): no errors and no
      # warnings, with their expects held to the responses recorded beside each set.
      - name: Lint the example lessons
        working-directory: ui
        shell: bash
        run: |
          npm run build:cli
          for set in community-sample second-look third-time; do
            out="$(node build-cli/lessons-lint.mjs ../docs/lessons/examples/$set --release)" || { echo "$out"; exit 1; }
            echo "$out"
            echo "$out" | grep -q '0 error(s), 0 warning(s)\.' || { echo "$set has lint warnings"; exit 1; }
          done
